<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="1000" viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for Purple Velvet Folds -->
    <linearGradient id="purpleGrad1" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#8b2fc9" />
      <stop offset="40%" stop-color="#5c1399" />
      <stop offset="100%" stop-color="#2d0554" />
    </linearGradient>
    
    <linearGradient id="purpleGrad2" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#a83bf0" />
      <stop offset="50%" stop-color="#6d1bb5" />
      <stop offset="100%" stop-color="#3c0a6b" />
    </linearGradient>

    <linearGradient id="purpleGrad3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#550e8f" />
      <stop offset="100%" stop-color="#180033" />
    </linearGradient>

    <!-- Metallic/Chrome Gradient for the Borders -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Shadow filter for depth -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background (Dark Theme matching 3ds Max style) -->
  <rect width="100%" height="100%" fill="#12131a" />

  <g filter="url(#shadow)" transform="translate(10, 0)">
    <!-- 1. BACKING SHADOW & OUTER CYAN/BLUE STROKE (The glow/accent border) -->
    <!-- We draw the main silhouette slightly scaled up or with a stroke -->
    <path d="M 280 850 
             C 280 850, 240 760, 220 620 
             C 200 480, 230 280, 360 170 
             C 490 60, 680 140, 700 240 
             C 710 290, 650 320, 560 310 
             C 450 300, 390 350, 390 440 
             C 430 450, 500 450, 590 460
             C 670 470, 710 520, 680 580
             C 650 640, 570 650, 480 640
             C 380 630, 360 670, 380 740
             C 400 810, 410 890, 320 920
             C 290 930, 280 890, 280 850 Z" 
          fill="none" 
          stroke="#00a8cc" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- 2. SILVERY CHROME OUTER FRAMING (Thick White/Silver Ribbon) -->
    <path d="M 280 850 
             C 280 850, 240 760, 220 620 
             C 200 480, 230 280, 360 170 
             C 490 60, 680 140, 700 240 
             C 710 290, 650 320, 560 310 
             C 450 300, 390 350, 390 440 
             C 430 450, 500 450, 590 460
             C 670 470, 710 520, 680 580
             C 650 640, 570 650, 480 640
             C 380 630, 360 670, 380 740
             C 400 810, 410 890, 320 920
             C 290 930, 280 890, 280 850 Z" 
          fill="#ffffff" 
          stroke="url(#chromeGrad)" 
          stroke-width="10" 
          stroke-linejoin="round" />

    <!-- 3. MAIN FABRIC PIECES (Layered Purple Folds) -->
    
    <!-- Top Loop & Stem Fold (Deep base) -->
    <path d="M 285 840
             C 265 750, 235 610, 235 500
             C 235 380, 285 240, 385 170
             C 475 110, 615 130, 675 220
             C 645 270, 585 290, 505 290
             C 405 290, 355 360, 355 450
             C 355 530, 345 610, 335 700
             C 325 780, 345 840, 315 880
             C 305 890, 295 870, 285 840 Z" 
          fill="url(#purpleGrad1)" />

    <!-- Overlapping Upper Velvet Swell (Top-right curve folding over) -->
    <path d="M 385 170
             C 475 110, 615 130, 675 220
             C 645 250, 565 250, 485 210
             C 405 170, 345 200, 315 280
             C 325 380, 355 460, 355 450
             C 355 360, 405 290, 505 290
             C 585 290, 645 270, 675 220 Z" 
          fill="url(#purpleGrad2)" 
          opacity="0.95" />

    <!-- Middle Bar (Folded Loop of the F) -->
    <path d="M 355 450
             C 395 455, 485 455, 575 465
             C 655 475, 685 515, 665 565
             C 635 615, 555 625, 475 615
             C 395 605, 375 615, 365 650
             C 355 690, 345 560, 355 450 Z" 
          fill="url(#purpleGrad2)" />

    <!-- Crease & Shading Layer for the Middle Bar (Inner Fold) -->
    <path d="M 375 475
             C 435 480, 525 485, 595 505
             C 635 515, 645 545, 625 565
             C 595 585, 505 595, 435 585
             C 385 575, 365 530, 375 475 Z" 
          fill="url(#purpleGrad3)" 
          opacity="0.8" />

    <!-- 4. HAND-DRAWN INNER FOLD LINES (Defining the fabric creases) -->
    <!-- Vertical crease along the stem -->
    <path d="M 285 840 C 265 730, 275 550, 325 410" 
          fill="none" 
          stroke="#1e003b" 
          stroke-width="4" 
          opacity="0.6" />
          
    <path d="M 315 880 C 305 790, 305 680, 335 550" 
          fill="none" 
          stroke="#3b0764" 
          stroke-width="3" 
          opacity="0.5" />

    <!-- Main swoop crease defining the upper fold direction -->
    <path d="M 385 170 C 375 240, 355 350, 355 450" 
          fill="none" 
          stroke="#1e003b" 
          stroke-width="5" 
          opacity="0.7" />

    <path d="M 485 210 C 445 250, 385 300, 355 450" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="2" 
          opacity="0.15" />
  </g>
</svg>
